version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep type definitions aligned with the Node 22 runtime.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

      # Next.js linting currently depends on plugins that support ESLint 9.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

      # typescript-eslint does not yet support the TypeScript 7 API.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      compatible-npm-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
